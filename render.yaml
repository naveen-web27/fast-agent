services:
  - type: web
    name: whatsapp-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT --log-level info
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////opt/render/project/src/data/app.db
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v20.0
      - key: ADMIN_API_KEY
        sync: false
      - key: ENV
        value: production
