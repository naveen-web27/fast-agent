services:
  - type: web
    name: rightconnect-staging
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PRO_AMOUNT_PAISE
        sync: false
      - key: RAZORPAY_ENTERPRISE_AMOUNT_PAISE
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_PATH
        sync: false
      - key: ADMIN_BASIC_USER
        sync: false
      - key: ADMIN_BASIC_PASSWORD
        sync: false
      - key: ADMIN_EMAILS
        sync: false