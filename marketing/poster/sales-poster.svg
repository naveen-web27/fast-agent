<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="posterTitle posterDesc">
  <title id="posterTitle">RightConnect — Verified Experts. Zero Guesswork.</title>
  <desc id="posterDesc">Sales poster promoting the RightConnect trust marketplace for verified experts and companies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182844"/>
      <stop offset="100%" stop-color="#0b1526"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0aa79d"/>
      <stop offset="100%" stop-color="#088a82"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c8b82" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0c8b82" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#04140f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="880" cy="120" r="340" fill="url(#glow)"/>
  <circle cx="120" cy="1220" r="300" fill="url(#glow)" opacity="0.7"/>

  <!-- subtle grid dots -->
  <g opacity="0.08">
    <path d="M0 0h1080M0 90h1080M0 180h1080M0 270h1080" stroke="#8de8cd" stroke-width="1"/>
  </g>

  <!-- Logo lockup -->
  <g transform="translate(70,64)">
    <rect width="64" height="64" rx="16" fill="#0c8b82"/>
    <path d="M17 15h16.5c9.4 0 15.5 4.7 15.5 12.4 0 5.1-2.9 9-7.8 10.8L49 49H37.2L30.8 40H27v9H17V15Zm10 8v9.3h6.1c3.6 0 5.8-1.6 5.8-4.7 0-3.1-2.2-4.6-5.8-4.6H27Z" fill="#fff"/>
    <circle cx="49" cy="15" r="6" fill="#8de8cd"/>
    <path d="M49 12v6M46 15h6" stroke="#0c8b82" stroke-width="2" stroke-linecap="round"/>
    <text x="80" y="30" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">RightConnect</text>
    <text x="80" y="54" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8de8cd" letter-spacing="0.5">VERIFIED EXPERTS &amp; COMPANIES</text>
  </g>

  <!-- Eyebrow chip -->
  <g transform="translate(70,178)">
    <rect width="330" height="44" rx="22" fill="#0c8b82" opacity="0.18" stroke="#8de8cd" stroke-width="1"/>
    <text x="24" y="29" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#8de8cd">Stop guessing. Start connecting.</text>
  </g>

  <!-- Headline -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="800" fill="#ffffff">
    <text x="70" y="300" font-size="72">Find Verified</text>
    <text x="70" y="378" font-size="72">Pros You Can</text>
    <text x="70" y="456" font-size="72" fill="#8de8cd">Actually Trust.</text>
  </g>

  <!-- Subheadline -->
  <text x="70" y="516" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#c7d0e0">
    <tspan x="70" dy="0">Compare verified experts and companies,</tspan>
    <tspan x="70" dy="32">chat, and book — all in one trusted place.</tspan>
  </text>

  <!-- Feature pills -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#0b2b26">
    <g transform="translate(70,596)">
      <rect width="440" height="64" rx="32" fill="#e5f6f2"/>
      <circle cx="34" cy="32" r="15" fill="#17865a"/>
      <path d="M27 32l5 5 10-11" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="39">ID &amp; credential verified</text>
    </g>
    <g transform="translate(70,676)">
      <rect width="440" height="64" rx="32" fill="#e5f6f2"/>
      <circle cx="34" cy="32" r="15" fill="#e3a315"/>
      <path d="M34 22l3.5 7.2 7.9 1.1-5.7 5.6 1.3 7.9-7-3.7-7 3.7 1.3-7.9-5.7-5.6 7.9-1.1z" fill="#ffffff"/>
      <text x="60" y="39">Real, verified customer reviews</text>
    </g>
    <g transform="translate(70,756)">
      <rect width="440" height="64" rx="32" fill="#e5f6f2"/>
      <circle cx="34" cy="32" r="15" fill="#088a82"/>
      <path d="M34 22v10l7 5" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="39">Fast response, guaranteed</text>
    </g>
  </g>

  <!-- CTA button -->
  <g transform="translate(70,860)" filter="url(#softShadow)">
    <rect width="470" height="88" rx="44" fill="url(#ctaGrad)"/>
    <text x="235" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Get Matched — It's Free →</text>
  </g>

  <!-- Trust strip -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#c7d0e0">
    <text x="70" y="1000" font-size="19">★★★★★ &#160;<tspan fill="#ffffff" font-weight="700">4.9/5</tspan> average rating from verified customers</text>
  </g>

  <!-- Divider -->
  <line x1="70" y1="1050" x2="1010" y2="1050" stroke="#2a3a58" stroke-width="1.5"/>

  <!-- Bottom CTA bar -->
  <g transform="translate(70,1090)">
    <rect width="940" height="150" rx="24" fill="#ffffff" opacity="0.06"/>
    <g transform="translate(28,28)">
      <circle cx="35" cy="35" r="35" fill="#17865a"/>
      <path d="M20 35a15 15 0 1 1 5.4 11.5L18 49l2.6-7A14.9 14.9 0 0 1 20 35Z" fill="#ffffff"/>
      <path d="M27 29c.6-1.2 1.2-1.2 1.8 0l1 2c.4.8.2 1.4-.3 1.9-1 .9-1 1.6-.2 2.7 1 1.4 2.4 2.6 4 3.3 1.1.5 1.7.3 2.5-.6l.6-.7c.6-.6 1.2-.7 1.9-.2l2.3 1.6c1 .7 1 1.4.4 2.4-1.4 2.4-4.9 2.7-7.3 1.6-3.4-1.5-6.6-4.4-8.4-7.7-1.3-2.3-1.5-4.8.7-6.3Z" fill="#17865a" transform="translate(1,1) scale(.9)"/>
    </g>
    <text x="98" y="52" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Chat with us on WhatsApp</text>
    <text x="98" y="84" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8de8cd" font-weight="600">+91 63825 95243</text>
    <text x="912" y="68" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8b96ad">rightconnect.app</text>
  </g>
</svg>
